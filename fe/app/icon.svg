<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tailwind bg-gradient-to-br from-indigo-500 to-blue-500 -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Tailwind shadow-lg approximation -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.1" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Box (Scaled to allow room for the shadow) -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bg-gradient)" filter="url(#shadow)" />

  <!-- SF Text -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="220" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    SF
  </text>
</svg>
